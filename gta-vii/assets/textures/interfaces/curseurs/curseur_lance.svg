<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- La pointe (3, 3) correspond exactement au point de clic dans Godot. -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff4d7"/><stop offset="1" stop-color="#a99a7e"/>
    </linearGradient>
    <linearGradient id="poignee" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#df6650"/><stop offset="1" stop-color="#8e302c"/>
    </linearGradient>
  </defs>
  <!-- La lance prolonge la fleche : corps metallique et petite poignee rouge. -->
  <g stroke="#201b18" stroke-width="1.8" stroke-linejoin="round">
    <path d="M12 12 L25 23 L21 27 L10 15 Z" fill="url(#metal)"/>
    <path d="M20 21 L25 24 L22 30 L18 28 Z" fill="url(#poignee)"/>
    <path d="M20 21 L23 18 L27 21" fill="none" stroke="#e2b383" stroke-width="2.8"/>
    <path d="M3 3 L5 23 L11 16 L23 15 Z" fill="url(#metal)"/>
  </g>
  <path d="M5 7 L6.5 17" fill="none" stroke="#fff9e9" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M15 17 L19 20" fill="none" stroke="#fff5dc" stroke-width="1"/>
</svg>
